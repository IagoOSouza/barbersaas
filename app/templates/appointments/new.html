{% extends "base.html" %}
{% block title %}Novo Agendamento{% endblock %}

{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-bold mb-6">Novo Agendamento</h1>

  <div class="bg-gray-900 border border-gray-800 rounded-lg p-6">
    <form method="POST" action="/appointments/new" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">Cliente</label>
        <select name="client_id" required
          class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
          <option value="">Selecione o cliente...</option>
          {% for client in clients %}
            <option value="{{ client.id }}">{{ client.name }} · {{ client.phone }}</option>
          {% endfor %}
        </select>
        <a href="/clients/new" class="text-xs text-yellow-600 hover:text-yellow-500 mt-1 inline-block">
          + Cadastrar novo cliente
        </a>
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Serviço</label>
        <select name="service_id" required
          class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
          <option value="">Selecione o serviço...</option>
          {% for service in services %}
            <option value="{{ service.id }}">{{ service.name }} · {{ service.duration_min }}min</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Data e Hora</label>
        <input type="datetime-local" name="scheduled_at" required
          class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Observações (opcional)</label>
        <textarea name="notes" rows="2"
          class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600"></textarea>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit"
          class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-2 rounded text-sm transition">
          Confirmar agendamento
        </button>
        <a href="/appointments"
          class="px-4 py-2 text-sm text-gray-400 hover:text-white border border-gray-700 rounded transition">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
