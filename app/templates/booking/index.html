<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar — {{ barbershop.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .slot-btn   { transition: background 0.15s, color 0.15s; }
    .day-btn    { transition: background 0.15s, color 0.15s; cursor: pointer; }
    .day-btn:hover    { background: #374151; }
    .slot-btn:hover   { background: #ca8a04 !important; color: #000 !important; }
    .day-selected     { background: #ca8a04 !important; color: #000 !important; }
    .slot-selected    { background: #ca8a04 !important; color: #000 !important; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center py-10">
  <div class="w-full max-w-sm px-4">

    <div class="text-center mb-6">
      <div class="text-4xl mb-2">✂</div>
      <h1 class="text-2xl font-bold text-yellow-600">{{ barbershop.name }}</h1>
      <p class="text-gray-500 text-sm mt-1">Escolha data e horário</p>
    </div>

    {% if error %}
      <div class="bg-red-900 text-red-200 text-sm p-3 rounded mb-4">{{ error }}</div>
    {% endif %}

    <div class="bg-gray-900 border border-gray-800 rounded-lg p-5 space-y-5">

      <form method="POST" action="/b/{{ barbershop.slug }}/confirm" id="booking-form">

        <!-- Nome -->
        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Seu nome *</label>
          <input type="text" name="name" required
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
        </div>

        <!-- WhatsApp -->
        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">WhatsApp *</label>
          <input type="tel" name="phone" required placeholder="11999999999"
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
        </div>

        <!-- Barbeiro (só aparece se tiver mais de 1) -->
        {% if barbers|length > 1 %}
        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Barbeiro</label>
          <select name="barber_id" id="barber-select" required
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
            {% for barber in barbers %}
              <option value="{{ barber.id }}">{{ barber.name }}</option>
            {% endfor %}
          </select>
        </div>
        {% else %}
          <input type="hidden" name="barber_id" id="barber-select" value="{{ barbers[0].id }}">
        {% endif %}

        <!-- Serviço -->
        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Serviço</label>
          <select name="service_id" required
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
            {% for service in services %}
              <option value="{{ service.id }}">
                {{ service.name }} · R$ {{ "%.2f"|format(service.price) }}
              </option>
            {% endfor %}
          </select>
        </div>

        <!-- Seletor de dias -->
        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Data</label>
          <div id="day-grid" class="grid grid-cols-7 gap-1"></div>
        </div>

        <!-- Grade de horários -->
        <div>
          <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">
            Horário
            <span id="slots-label" class="text-gray-600 normal-case ml-1">— selecione uma data</span>
          </label>
          <div id="slots-grid" class="grid grid-cols-4 gap-2">
            <div class="col-span-4 text-center py-4 text-gray-600 text-sm">
              Escolha um dia primeiro
            </div>
          </div>
        </div>

        <!-- Resumo do agendamento -->
        <div id="summary" class="hidden bg-gray-800 border border-gray-700 rounded p-3 text-sm">
          <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">Selecionado</div>
          <div id="summary-text" class="text-yellow-500 font-medium"></div>
        </div>

        <!-- Campo hidden com datetime final -->
        <input type="hidden" name="scheduled_at" id="scheduled-at">

        <!-- Legenda -->
        <div class="flex gap-4 justify-center text-xs text-gray-600">
          <span class="flex items-center gap-1">
            <span class="w-3 h-3 rounded bg-yellow-600 inline-block"></span> selecionado
          </span>
          <span class="flex items-center gap-1">
            <span class="w-3 h-3 rounded bg-gray-700 inline-block"></span> disponível
          </span>
          <span class="flex items-center gap-1">
            <span class="w-3 h-3 rounded bg-gray-800 opacity-40 inline-block"></span> ocupado
          </span>
        </div>

        <!-- Botão -->
        <button type="submit" id="submit-btn" disabled
          class="w-full py-3 rounded font-bold text-sm transition
                 disabled:bg-gray-800 disabled:text-gray-600 disabled:cursor-not-allowed
                 bg-yellow-600 hover:bg-yellow-500 text-black">
          Confirmar agendamento
        </button>

      </form>
    </div>
  </div>

  <script>
    const slug = "{{ barbershop.slug }}";
    const DAYS   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    // Horários disponíveis — ajuste conforme horário da barbearia
    const ALL_SLOTS = [
      '08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30',
      '13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30',
      '17:00','17:30','18:00','18:30'
    ];

    let selectedDayIndex = null;
    let selectedSlot = null;
    let selectedDate = null;

    const today = new Date();
    today.setHours(0,0,0,0);

    const barberSelect  = document.getElementById('barber-select');
    const slotsGrid     = document.getElementById('slots-grid');
    const slotsLabel    = document.getElementById('slots-label');
    const scheduledAt   = document.getElementById('scheduled-at');
    const submitBtn     = document.getElementById('submit-btn');
    const summary       = document.getElementById('summary');
    const summaryText   = document.getElementById('summary-text');

    // ── Monta os próximos 14 dias ─────────────────────────────
    const dayGrid = document.getElementById('day-grid');
    // Só mostra 7 dias na grade; usuário pode ver mais via scroll se necessário
    for (let i = 0; i < 14; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      const isSunday = d.getDay() === 0;

      const btn = document.createElement('div');
      btn.className = 'day-btn rounded text-center py-2 border border-gray-700 text-xs select-none' +
        (isSunday ? ' opacity-30 cursor-not-allowed' : '');
      btn.style.background = '#1f2937';
      btn.innerHTML = `
        <div class="text-gray-500" style="font-size:10px">${DAYS[d.getDay()]}</div>
        <div class="font-semibold text-white" style="font-size:14px;line-height:1.3">${d.getDate()}</div>
        <div class="text-gray-500" style="font-size:10px">${MONTHS[d.getMonth()]}</div>
      `;

      if (!isSunday) {
        btn.addEventListener('click', () => selectDay(i, d, btn));
      }
      dayGrid.appendChild(btn);
    }

    // ── Seleciona um dia ──────────────────────────────────────
    function selectDay(idx, date, btn) {
      selectedDayIndex = idx;
      selectedDate = date;
      selectedSlot = null;
      scheduledAt.value = '';
      updateSummary();

      document.querySelectorAll('.day-btn').forEach(b => {
        b.classList.remove('day-selected');
        b.style.background = '#1f2937';
      });
      btn.classList.add('day-selected');
      btn.style.background = '';

      const label = `${date.getDate()} de ${MONTHS[date.getMonth()]}`;
      slotsLabel.textContent = `— ${label}`;
      slotsLabel.className = 'text-gray-300 normal-case ml-1 text-xs';

      slotsGrid.innerHTML = '<div class="col-span-4 text-center py-3 text-gray-500 text-sm">Carregando...</div>';

      const barberId = barberSelect.value || barberSelect.getAttribute('value');
      const dateStr  = date.toISOString().split('T')[0];

      fetch(`/b/${slug}/slots?barber_id=${barberId}&date=${dateStr}`)
        .then(r => r.json())
        .then(data => renderSlots(data.busy || [], date))
        .catch(() => renderSlots([], date));
    }

    // ── Renderiza os botões de horário ────────────────────────
    function renderSlots(busy, date) {
      slotsGrid.innerHTML = '';
      const now = new Date();
      const isToday = date.toDateString() === now.toDateString();
      let hasAny = false;

      ALL_SLOTS.forEach(slot => {
        const isBusy = busy.includes(slot);
        let isPast = false;
        if (isToday) {
          const [h, m] = slot.split(':').map(Number);
          const t = new Date(); t.setHours(h, m, 0, 0);
          isPast = t <= now;
        }

        const btn = document.createElement('div');
        btn.textContent = slot;
        btn.style.cssText = 'border-radius:6px; padding:8px 4px; text-align:center; font-size:13px; border:1px solid;';

        if (isBusy || isPast) {
          btn.style.background = '#111827';
          btn.style.color = '#374151';
          btn.style.borderColor = '#1f2937';
          btn.style.textDecoration = 'line-through';
          btn.title = isBusy ? 'Ocupado' : 'Horário passado';
        } else {
          hasAny = true;
          btn.className = 'slot-btn';
          btn.style.background = '#1f2937';
          btn.style.color = '#d1d5db';
          btn.style.borderColor = '#374151';
          btn.style.cursor = 'pointer';
          btn.addEventListener('click', () => selectSlot(slot, btn, date));
        }

        slotsGrid.appendChild(btn);
      });

      if (!hasAny) {
        slotsGrid.innerHTML = '<div class="col-span-4 text-center py-4 text-gray-600 text-sm">Nenhum horário disponível neste dia.</div>';
      }
    }

    // ── Seleciona um horário ──────────────────────────────────
    function selectSlot(slot, btn, date) {
      selectedSlot = slot;

      document.querySelectorAll('.slot-btn').forEach(b => {
        b.classList.remove('slot-selected');
        b.style.background = '#1f2937';
        b.style.color = '#d1d5db';
      });
      btn.classList.add('slot-selected');
      btn.style.background = '';
      btn.style.color = '';

      const dateStr = date.toISOString().split('T')[0];
      scheduledAt.value = `${dateStr}T${slot}`;
      updateSummary();
    }

    // ── Atualiza resumo e botão ───────────────────────────────
    function updateSummary() {
      if (selectedDate && selectedSlot) {
        const label = `${DAYS[selectedDate.getDay()]}, ${selectedDate.getDate()} de ${MONTHS[selectedDate.getMonth()]} às ${selectedSlot}`;
        summaryText.textContent = label;
        summary.classList.remove('hidden');
        submitBtn.disabled = false;
      } else {
        summary.classList.add('hidden');
        submitBtn.disabled = true;
      }
    }

    // Se trocar de barbeiro, recarrega os horários do dia selecionado
    if (barberSelect.tagName === 'SELECT') {
      barberSelect.addEventListener('change', () => {
        if (selectedDate) selectDay(selectedDayIndex, selectedDate,
          dayGrid.children[selectedDayIndex]);
      });
    }
  </script>
</body>
</html>
