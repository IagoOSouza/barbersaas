{% extends "base.html" %}
{% block title %}Novo Serviço{% endblock %}

{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-bold mb-6">Novo Serviço</h1>

  <div class="bg-gray-900 border border-gray-800 rounded-lg p-6">
    <form method="POST" action="/services/new" class="space-y-4">

      <div>
        <label class="block text-sm text-gray-400 mb-1">Nome do serviço *</label>
        <input type="text" name="name" required placeholder="Ex: Corte, Barba, Combo..."
          class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1">Duração (minutos) *</label>
          <input type="number" name="duration_min" required min="5" step="5" value="30"
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Preço (R$) *</label>
          <input type="number" name="price" required min="0" step="0.01" placeholder="35.00"
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-600">
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit"
          class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-2 rounded text-sm transition">
          Salvar serviço
        </button>
        <a href="/services"
          class="px-4 py-2 text-sm text-gray-400 hover:text-white border border-gray-700 rounded transition">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
